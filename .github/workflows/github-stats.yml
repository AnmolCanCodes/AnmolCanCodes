
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      # 1. GitHub Stats
      - name: Generate GitHub Stats
        id: stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=AnmolCanCodes&show_icons=true&theme=nord&hide_border=true&title_color=90EE90&icon_color=90EE90&text_color=c9d1d9&bg_color=0D1117"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: false

      # 2. Top Languages
      - name: Generate Top Languages
        id: languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=AnmolCanCodes&layout=compact&langs_count=8&theme=nord&hide_border=true&title_color=90EE90&text_color=c9d1d9&bg_color=0D1117"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: false

      # 3. Contribution Streak
      - name: Generate Contribution Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: "user=AnmolCanCodes&theme=dark&background=0D1117&ring=90EE90&fire=90EE90&currStreakLabel=90EE90&hide_border=true&disable_animations=true"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Print diagnostic information
      - name: Print diagnostic information
        if: always()
        env:
          STATS_TYPE: ${{ steps.stats.outputs.error_type }}
          STATS_ERROR: ${{ steps.stats.outputs.error_message }}
          STATS_SECONDARY: ${{ steps.stats.outputs.error_secondary_message }}
          LANG_TYPE: ${{ steps.languages.outputs.error_type }}
          LANG_ERROR: ${{ steps.languages.outputs.error_message }}
          LANG_SECONDARY: ${{ steps.languages.outputs.error_secondary_message }}
        run: |
          echo "===== GITHUB STATS ====="
          echo "Error type: $STATS_TYPE"
          echo "Error message: $STATS_ERROR"
          echo "Secondary error: $STATS_SECONDARY"

          echo "===== TOP LANGUAGES ====="
          echo "Error type: $LANG_TYPE"
          echo "Error message: $LANG_ERROR"
          echo "Secondary error: $LANG_SECONDARY"

      # 5. Commit generated SVG files
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes in GitHub stats."
            exit 0
          fi

          git commit -m "chore: update GitHub profile stats"
          git push
