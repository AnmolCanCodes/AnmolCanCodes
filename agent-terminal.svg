<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round-corners">
      <rect x="0" y="0" width="760" height="320" rx="14" />
    </clipPath>
  </defs>

  <style>
    .term-bg     { fill: #0d1117; }
    .term-header { fill: #161b22; }
    .term-text   { font-family: 'Courier New', Consolas, monospace; font-size: 17px; fill: #90EE90; }
    .term-title  { font-family: 'Courier New', Consolas, monospace; font-size: 12px; fill: #8b949e; }
    .dot-red     { fill: #ff5f56; }
    .dot-yellow  { fill: #ffbd2e; }
    .dot-green   { fill: #27c93f; }
    .cursor      { fill: #90EE90; }
    .border      { fill: none; stroke: #30363d; stroke-width: 1; }

    @keyframes line0 { 0% {opacity:0} 1.5% {opacity:1} 14% {opacity:1} 16% {opacity:0} 100% {opacity:0} }
    @keyframes line1 { 0%,16.6667% {opacity:0} 18.1667% {opacity:1} 30.6667% {opacity:1} 32.6667% {opacity:0} 100% {opacity:0} }
    @keyframes line2 { 0%,33.3333% {opacity:0} 34.8333% {opacity:1} 47.3333% {opacity:1} 49.3333% {opacity:0} 100% {opacity:0} }
    @keyframes line3 { 0%,50% {opacity:0} 51.5% {opacity:1} 64% {opacity:1} 66% {opacity:0} 100% {opacity:0} }
    @keyframes line4 { 0%,66.6667% {opacity:0} 68.1667% {opacity:1} 80.6667% {opacity:1} 82.6667% {opacity:0} 100% {opacity:0} }
    @keyframes line5 { 0%,83.3333% {opacity:0} 84.8333% {opacity:1} 99.5% {opacity:1} 100% {opacity:1} }
    @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }

    .l0 { animation: line0 13s linear infinite; }
    .l1 { animation: line1 13s linear infinite; }
    .l2 { animation: line2 13s linear infinite; }
    .l3 { animation: line3 13s linear infinite; }
    .l4 { animation: line4 13s linear infinite; }
    .l5 { animation: line5 13s linear infinite; }
    .blinker { animation: blink 0.8s steps(1) infinite; }
  </style>

  <g clip-path="url(#round-corners)">
    <rect class="term-bg" x="0" y="0" width="760" height="320" />
    <rect class="term-header" x="0" y="0" width="760" height="36" />
  </g>
  <rect class="border" x="0.5" y="0.5" width="759" height="319" rx="14" />

  <circle class="dot-red" cx="24" cy="18" r="6" />
  <circle class="dot-yellow" cx="44" cy="18" r="6" />
  <circle class="dot-green" cx="64" cy="18" r="6" />
  <text class="term-title" x="380" y="22" text-anchor="middle">agent://repo-intelligence-agent</text>

  <g class="l0"><text class="term-text" x="24" y="84">$ agent.analyze("AnmolCanCodes")</text></g>
  <g class="l1"><text class="term-text" x="24" y="124">&#8594; scanning commit history...</text></g>
  <g class="l2"><text class="term-text" x="24" y="164">&#8594; found: RAG pipelines, agentic workflows, FastAPI services</text></g>
  <g class="l3"><text class="term-text" x="24" y="204">&#8594; cross-referencing AI-Repo-Intelligence-Agent</text></g>
  <g class="l4"><text class="term-text" x="24" y="244">&#8594; verdict: ships production-ready AI systems</text></g>
  <g class="l5">
    <text class="term-text" x="24" y="284">&#8594; status: currently building</text>
    <rect class="cursor blinker" x="336" y="270" width="10" height="19" />
  </g>
</svg>
